[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecut"
version = "0.1.0"
description = "Evidence-grounded, provenance-aware short-video editing agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Research-only prototype"}
authors = [{name = "TraceCut contributors"}]
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.60,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
tracecut = "tracecut.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
