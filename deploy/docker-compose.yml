services:
  tracecut:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tracecut-demo:latest
    container_name: tracecut-demo
    ports:
      - "7860:7860"   # Gradio UI
      - "8000:8000"   # FastAPI（备选）
    environment:
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-Qwen/Qwen3.5-35B-A3B}
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      TRACECUT_OUTPUT_DIR: /app/runs
    volumes:
      - tracecut_runs:/app/runs

volumes:
  tracecut_runs:
